data:
  raw_path: data/raw/turbine_5yr_labeled_data.csv
  processed_dir: data/processed/lstm_autoencoder
  processed_filename: processed_features.csv
  timestamp_col: timestamp
  label_col: is_anomaly
  window_size: 36
  stride: 1
  val_split: 0.2

model:
  input_size: 15
  hidden_size: 32
  latent_size: 12
  num_layers: 1
  dropout: 0.2
  recurrent_dropout: 0.2

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.001
  random_seed: 42
  device: auto
  threshold_quantile: 0.95
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0001
  grad_clip: 1.0
  model_path: data/processed/lstm_autoencoder/model.pt
  scaler_path: data/processed/lstm_autoencoder/scaler.pkl
